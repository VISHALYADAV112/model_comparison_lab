[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "three-model-vision-lab"
version = "0.1.0"
description = "A reproducible YOLO, RF-DETR, and SAM 3 comparison lab with a LAN playground"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "huggingface-hub>=0.34",
  "numpy>=1.26",
  "Pillow>=10.4",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.4"]
rfdetr = ["rfdetr>=1.9,<2"]
playground = ["gradio>=5.49,<7", "opencv-python-headless>=4.10"]
all = [
  "ultralytics>=8.4",
  "rfdetr>=1.9,<2",
  "gradio>=5.49,<7",
  "opencv-python-headless>=4.10",
]
dev = ["pytest>=8.3"]

[project.scripts]
model-lab = "model_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

