[build-system]
requires = ["setuptools>=75,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "three-model-vision-lab"
version = "0.2.4"
description = "A reproducible YOLO, RF-DETR, and SAM 3 comparison lab with a LAN playground"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "huggingface-hub>=0.34",
  # Required by sam3.sam.rope, but missing from Meta's base dependency list.
  "einops>=0.8,<1",
  # Imported by SAM's core dataset types while constructing the image model.
  "pycocotools>=2.0.7,<3",
  # Imported by the official video predictor; declare it instead of relying on Gradio.
  "psutil>=5.9,<8",
  "numpy>=1.26,<2",
  "Pillow>=10.4",
  # The pinned Meta SAM source still imports pkg_resources, removed in setuptools 82.
  "setuptools>=75,<82",
  # Ultralytics may install SciPy; current SciPy 1.18 requires NumPy 2.
  "scipy<1.18",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.4"]
rfdetr = ["rfdetr>=1.9,<2"]
playground = ["gradio>=6,<7", "opencv-python-headless==4.11.0.86"]
all = [
  "ultralytics>=8.4",
  "rfdetr>=1.9,<2",
  "gradio>=6,<7",
  "opencv-python-headless==4.11.0.86",
]
dev = ["pytest>=8.3"]

[project.scripts]
model-lab = "model_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
